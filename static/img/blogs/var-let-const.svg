<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f7df1e" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />

  <!-- JavaScript Logo Accent -->
  <rect x="1000" y="50" width="120" height="120" rx="16" fill="#f7df1e" />
  <text x="1060" y="130" font-family="Arial, sans-serif" font-weight="bold" font-size="60" fill="#000" text-anchor="middle">JS</text>

  <!-- Title Section -->
  <text x="80" y="100" font-family="Inter, sans-serif" font-weight="800" font-size="44" fill="url(#accent)">JAVASCRIPT MASTERY</text>
  <text x="80" y="150" font-family="Inter, sans-serif" font-weight="700" font-size="32" fill="#ffffff">var vs. let vs. const</text>

  <!-- Card 1: var -->
  <rect x="80" y="200" width="320" height="360" rx="16" fill="#1e293b" stroke="#334155" stroke-width="2" />
  <rect x="80" y="200" width="320" height="8" fill="#ef4444" rx="4" />
  <text x="110" y="260" font-family="monospace" font-weight="bold" font-size="32" fill="#ef4444">var</text>
  <text x="110" y="310" font-family="sans-serif" font-size="18" fill="#cbd5e1">• Function Scoped</text>
  <text x="110" y="350" font-family="sans-serif" font-size="18" fill="#cbd5e1">• Hoisted (undefined)</text>
  <text x="110" y="390" font-family="sans-serif" font-size="18" fill="#cbd5e1">• Re-declarable</text>
  <text x="110" y="430" font-family="sans-serif" font-size="18" fill="#cbd5e1">• Re-assignable</text>

  <!-- Card 2: let -->
  <rect x="440" y="200" width="320" height="360" rx="16" fill="#1e293b" stroke="#334155" stroke-width="2" />
  <rect x="440" y="200" width="320" height="8" fill="#3b82f6" rx="4" />
  <text x="470" y="260" font-family="monospace" font-weight="bold" font-size="32" fill="#3b82f6">let</text>
  <text x="470" y="310" font-family="sans-serif" font-size="18" fill="#cbd5e1">• Block Scoped</text>
  <text x="470" y="350" font-family="sans-serif" font-size="18" fill="#cbd5e1">• Temporal Dead Zone</text>
  <text x="470" y="390" font-family="sans-serif" font-size="18" fill="#cbd5e1">• No Re-declaration</text>
  <text x="470" y="430" font-family="sans-serif" font-size="18" fill="#cbd5e1">• Re-assignable</text>

  <!-- Card 3: const -->
  <rect x="800" y="200" width="320" height="360" rx="16" fill="#1e293b" stroke="#334155" stroke-width="2" />
  <rect x="800" y="200" width="320" height="8" fill="#10b981" rx="4" />
  <text x="830" y="260" font-family="monospace" font-weight="bold" font-size="32" fill="#10b981">const</text>
  <text x="830" y="310" font-family="sans-serif" font-size="18" fill="#cbd5e1">• Block Scoped</text>
  <text x="830" y="350" font-family="sans-serif" font-size="18" fill="#cbd5e1">• Temporal Dead Zone</text>
  <text x="830" y="390" font-family="sans-serif" font-size="18" fill="#cbd5e1">• Fixed Binding</text>
  <text x="830" y="430" font-family="sans-serif" font-size="18" fill="#cbd5e1">• Mutable Properties</text>
</svg>
